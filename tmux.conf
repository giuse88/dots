# vim:ft=tmux:

# --- Prefix: C-a ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Shell: zsh in every pane, whatever the login shell is ---
# /bin/zsh exists on macOS and on Ubuntu (/bin -> /usr/bin)
set -g default-shell /bin/zsh

# --- Terminal / colours ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 10
set -g focus-events on
# Lets apps (e.g. Claude Code) distinguish Shift+Enter from Enter
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# --- Clipboard: copy from the remote headnode to the local clipboard via OSC 52 ---
set -s set-clipboard on

# --- General ---
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g allow-rename off
set -g display-time 2000

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Splits/new windows open in the current directory ---
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# --- Vim-style splits: prefix v = vertical (side by side), prefix s = horizontal ---
# (replaces the default prefix s session picker; prefix w still shows the tree)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# --- Vim-style pane select (prefix h/j/k/l) and resize (prefix H/J/K/L, repeatable) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Vim-style copy mode (prefix [ to enter, prefix ] to paste) ---
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Seamless vim/tmux pane switching ---
# Pairs with the vim-tmux-navigator plugin in nvim (nvim/lua/plugins.lua)
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n C-h  if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n C-j  if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n C-k  if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n C-l  if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind -T copy-mode-vi C-h  select-pane -L
bind -T copy-mode-vi C-j  select-pane -D
bind -T copy-mode-vi C-k  select-pane -U
bind -T copy-mode-vi C-l  select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l
# The shell's clear-screen / kill-line / delete-word, via the prefix
bind C-l send-keys C-l
bind C-k send-keys C-k
bind C-w send-keys C-w

# --- Vim-style C-w w / C-w C-w: cycle to the next pane ---
# In vim, C-w passes straight through. Elsewhere C-w waits for a second key.
bind -n C-w if-shell "$is_vim" 'send-keys C-w' 'switch-client -T ctrlw'
bind -T ctrlw w   select-pane -t :.+
bind -T ctrlw C-w select-pane -t :.+

# --- Status bar ---
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour235,bg=colour166,bold] #S #[bg=colour235,nobold] "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[fg=colour166 bold]PREFIX ,}#[fg=colour244,nobold]#h #[fg=colour231,bg=colour31,bold] %H:%M "
set -g window-status-format "#[fg=colour244] #I #W "
set -g window-status-current-format "#[fg=colour231,bg=colour31,bold] #I #W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=colour166"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"
set -g message-style "bg=colour31,fg=colour231"
setw -g monitor-activity on
set -g visual-activity off

# --- Plugins: persist sessions across reboots ---
# tmux-resurrect saves/restores sessions (prefix C-s / prefix C-r).
# tmux-continuum auto-saves every 15 min and restores when the tmux server starts.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
