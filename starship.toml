"$schema" = 'https://starship.rs/config-schema.json'

# Single line: env + path + git + duration + ❯ (cyan ok / red on error)
format = """
$conda\
$python\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$character"""

add_newline = false 
palette = 'catppuccin_macchiato'

[conda]
format = '[$environment]($style) '
style = 'green'
ignore_base = true

# Shows virtualenv name (e.g. uv/.venv); hides the version outside venvs
[python]
format = '[(\($virtualenv\) )]($style)'
style = 'green'
detect_extensions = []
detect_files = []

[directory]
style = 'blue'
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = '[\($branch]($style)'
style = 'mauve'

[git_state]
format = ' [$state( $progress_current/$progress_total)]($style)'
style = 'red'

[git_status]
format = '[$staged$modified$untracked$conflicted$ahead_behind]($style)[\)](mauve) '
style = 'yellow'
staged = '+'
modified = '*'
untracked = '?'
conflicted = '!'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕'

[cmd_duration]
format = '[$duration]($style) '
style = 'overlay1'
min_time = 2_000

[character]
success_symbol = '[❯](teal)'
error_symbol = '[❯](red)'

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
